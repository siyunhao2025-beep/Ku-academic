name: Ku-academic CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependency
        run: python -m pip install -r requirements.txt
      - name: Compile and test
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
          python scripts/check_repository.py
      - name: Run documented offline commands
        run: |
          python scripts/research.py doctor
          python scripts/quickstart.py runs/ci-demo
          python scripts/build_distribution.py --out dist
      - name: Check Windows launcher without interactive input
        if: runner.os == 'Windows'
        shell: cmd
        run: START_WINDOWS.bat < NUL
      - name: Upload source-only distribution
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Ku-academic-skill
          path: dist/
