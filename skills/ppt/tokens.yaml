font_sizes:
  page_title: 32
  card_title: 22
  body: 18
  caption: 12
  footer: 10
  kpi_number: 48
radii:
  card: 8
  tag: 8
  bar: 16
spacing:
  margin: 40
  block_gap: 24
  inner_gap: 16
  grid: 8
components:
  conclusion_card:
    height: 34
    radius: 12
    fill: bg_light_red
    text_color: brand_coral
    font_size: 16
    max_per_page: 1
    max_width: 420
  primary_cta:
    fill: bg_white
    text_color: brand_coral
    max_per_page: 1
  header_logo:
    size: 26
    pos: 40,25
  footer:
    y: 508
    font_size: 10
validation:
  canvas:
    width: 960
    height: 540
  min_font_size: 10
  max_font_variants: 6
  max_accent_colors: 2
  page_background: bg_white
  forbid_dark_page: true
  forbid_dark_fills: true
  dark_luminance_threshold: 60
  bottom_pill_bar:
    enabled: true
    min_y: 430
    min_width: 420
    max_height: 60
    colors:
    - bg_light_red
    - brand_coral
